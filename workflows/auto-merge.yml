name: Auto-merge Bot PRs

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' || github.actor == 'imgbot[bot]' || github.actor == 'github-actions[bot]'
    steps:
      - name: Enable auto-merge for bot PRs
        run: gh pr merge --auto --merge "${{ github.event.pull_request.number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
